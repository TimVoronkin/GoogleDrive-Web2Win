<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="popup.css">
</head>

<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="header-brand">
                <img src="icons/icon48.png" alt="Logo" class="header-logo">
                <div class="header-text">
                    <h2 class="title">GoogleDrive-Web2Win</h2>
                    <span class="version-badge" id="versionBadge"></span>
                </div>
            </div>
        </div>

        <!-- Master Switch -->
        <div class="card master-switch-card">
            <div class="master-switch-info">
                <span class="master-title">Extension Status</span>
                <span class="master-subtitle" id="statusBadge">Active</span>
            </div>
            <label class="toggle-switch">
                <input type="checkbox" id="extensionEnabled" checked />
                <span class="toggle-slider"></span>
            </label>
        </div>

        <!-- Settings Section -->
        <div class="settings-section" id="settingsSection">
            <div class="form-group">
                <label for="driveLetter">Drive Letter</label>
                <div class="select-wrapper">
                    <select id="driveLetter">
                        <option value="A">A:</option>
                        <option value="B">B:</option>
                        <option value="C">C:</option>
                        <option value="D">D:</option>
                        <option value="E">E:</option>
                        <option value="F">F:</option>
                        <option value="G" selected>G:</option>
                        <option value="H">H:</option>
                        <option value="I">I:</option>
                        <option value="J">J:</option>
                        <option value="K">K:</option>
                        <option value="L">L:</option>
                        <option value="M">M:</option>
                        <option value="N">N:</option>
                        <option value="O">O:</option>
                        <option value="P">P:</option>
                        <option value="Q">Q:</option>
                        <option value="R">R:</option>
                        <option value="S">S:</option>
                        <option value="T">T:</option>
                        <option value="U">U:</option>
                        <option value="V">V:</option>
                        <option value="W">W:</option>
                        <option value="X">X:</option>
                        <option value="Y">Y:</option>
                        <option value="Z">Z:</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label for="driveRootName">Drive Root Folder Name</label>
                <input type="text" id="driveRootName" value="My Drive" placeholder="e.g. My Drive or Мій Диск" />
            </div>

            <div class="form-group">
                <label for="pathDepth">Max Path Depth</label>
                <div class="select-wrapper">
                    <select id="pathDepth">
                        <option value="0">Full Path (Unlimited)</option>
                        <option value="1">1 step</option>
                        <option value="2">2 steps</option>
                        <option value="3">3 steps</option>
                        <option value="4">4 steps</option>
                        <option value="5" selected>5 steps</option>
                        <option value="6">6 steps</option>
                        <option value="7">7 steps</option>
                        <option value="8">8 steps</option>
                        <option value="9">9 steps</option>
                        <option value="10">10 steps</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label for="openMode">Open in Explorer Method</label>
                <div class="select-wrapper">
                    <select id="openMode">
                        <option value="fullPath" selected>Full Path (G:\My Drive\...)</option>
                        <option value="shortcut">Shortcut ID (.shortcut-targets-by-id)</option>
                    </select>
                </div>
                <span class="helper-text">Shared items always use Shortcut ID</span>
            </div>

            <div class="form-group checkbox-group">
                <label for="enableLogging" class="checkbox-label">
                    <input type="checkbox" id="enableLogging" checked />
                    <span class="custom-checkbox"></span>
                    <span>Enable Console Logs ([GDrive-Tim])</span>
                </label>
            </div>
        </div>
    </div>
    <script src="popup.js"></script>
</body>

</html>
